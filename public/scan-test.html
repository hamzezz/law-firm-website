<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص الماسح</title>
<style>
  body{margin:0;padding:16px;background:#0f172a;color:#e2e8f0;font:14px/1.7 system-ui,-apple-system,sans-serif}
  h1{font-size:17px;margin:0 0 14px}
  .row{background:#1e293b;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .k{color:#94a3b8;font-size:12px}
  .v{font-weight:700;word-break:break-all}
  .ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}
  button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;
    background:#d97706;color:#fff;font-size:15px;font-weight:700}
  pre{background:#020617;padding:10px;border-radius:8px;font-size:11px;
    white-space:pre-wrap;word-break:break-all;max-height:45vh;overflow:auto}
  img{max-width:100%;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<h1>تشخيص ماسح المستندات</h1>
<div id="info"></div>

<button id="scan">تشغيل ماسح جوجل</button>
<button id="clear" style="background:#334155">مسح النتيجة</button>

<pre id="out">— لم يُشغَّل بعد —</pre>
<div id="shot"></div>

<script>
(function(){
  var info = document.getElementById('info')
  var out  = document.getElementById('out')
  var shot = document.getElementById('shot')
  var C = window.Capacitor

  function row(k, v, cls){
    var d = document.createElement('div')
    d.className = 'row'
    d.innerHTML = '<div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div>'
    info.appendChild(d)
  }
  function log(x){ out.textContent += '\n' + x }

  /* ═══ الفحص الأول: هل الجسر موجود ويرى الإضافات؟ ═══ */
  row('جسر Capacitor', C ? 'موجود ✓' : 'غير موجود ✗', C ? 'ok' : 'bad')

  if (C) {
    row('المنصّة', C.getPlatform ? C.getPlatform() : '—')

    var native = !!(C.isNativePlatform && C.isNativePlatform())
    row('تطبيق أصلي؟', native ? 'نعم ✓' : 'لا — متصفّح', native ? 'ok' : 'warn')

    var headers = C.PluginHeaders || []
    var names = headers.map(function(h){ return h.name })
    row('الإضافات التي يراها الجسر', names.length ? names.join('، ') : 'لا شيء', names.length ? 'ok' : 'bad')

    var hasScanner = names.indexOf('DocumentScanner') !== -1
    row('ماسح المستندات', hasScanner ? 'مُسجَّل ✓' : 'غير مُسجَّل ✗', hasScanner ? 'ok' : 'bad')

    var hasFs = names.indexOf('Filesystem') !== -1
    row('إضافة Filesystem', hasFs ? 'مُسجَّلة ✓' : 'غير مُسجَّلة ✗', hasFs ? 'ok' : 'bad')

    row('convertFileSrc', C.convertFileSrc ? 'متوفّرة ✓' : 'غير متوفّرة ✗', C.convertFileSrc ? 'ok' : 'bad')
  }

  /* ═══ الطريق الثاني: قراءة الملف عبر Filesystem ثم فكّ ترميزه ═══ */
  function tryFilesystem(uri){
    var FS = C && C.Plugins && C.Plugins.Filesystem
    if (!FS) { log('\n[طريق ٢] ✗ إضافة Filesystem غير متاحة'); return }

    log('\n[طريق ٢] جارٍ القراءة عبر Filesystem…')
    FS.readFile({ path: uri }).then(function(res){
      var b64 = res && res.data ? res.data : ''
      log('[طريق ٢] ✓ عاد نصّ بطول ' + b64.length + ' حرفاً')
      try {
        var bin = atob(b64), n = bin.length, arr = new Uint8Array(n)
        for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i)
        var blob = new Blob([arr], { type: 'image/jpeg' })
        log('[طريق ٢] ✓ تحوّل إلى ملف: ' + Math.round(blob.size / 1024) + ' كيلوبايت')
        log('\n>>> طريق ٢ يعمل — التكامل عبر Filesystem <<<')
      } catch (err) {
        log('[طريق ٢] ✗ فشل فكّ الترميز: ' + err)
      }
    }).catch(function(e){
      log('[طريق ٢] ✗ فشل: ' + (e && e.message ? e.message : e))
      log('\n>>> الطريقان فشلا — أرسل لي هذا النصّ كاملاً <<<')
    })
  }

  /* ═══ التشغيل ═══ */
  document.getElementById('clear').onclick = function(){
    out.textContent = '—'
    shot.innerHTML = ''
  }

  document.getElementById('scan').onclick = function(){
    out.textContent = 'جارٍ الفتح…'
    shot.innerHTML = ''

    if (!C || !C.Plugins || !C.Plugins.DocumentScanner) {
      log('✗ الإضافة غير متاحة من الصفحة')
      log('Plugins = ' + (C && C.Plugins ? Object.keys(C.Plugins).join('، ') : 'لا شيء'))
      return
    }

    C.Plugins.DocumentScanner.scanDocument({
      resultFormats: 'JPEG',
      pageLimit: 1,
      scannerMode: 'FULL',
      galleryImportAllowed: true
    }).then(function(res){
      log('✓ عاد الماسح بنتيجة:')
      log(JSON.stringify(res, null, 2))

      var uri = res && res.scannedImages && res.scannedImages[0]
      if (!uri) { log('✗ لا يوجد مسار صورة في النتيجة'); return }

      var src = C.convertFileSrc ? C.convertFileSrc(uri) : uri
      log('\nالمسار بعد التحويل:\n' + src)

      var img = document.createElement('img')
      img.src = src
      shot.appendChild(img)

      /* الطريق الأول: جلب مباشر */
      fetch(src).then(function(r){
        log('\n[طريق ١] حالة الجلب: ' + r.status + (r.ok ? ' ✓' : ' ✗'))
        if (!r.ok) throw new Error('status ' + r.status)
        return r.blob()
      }).then(function(b){
        log('[طريق ١] ✓ قُرئت البايتات: ' + Math.round(b.size / 1024) + ' كيلوبايت، النوع ' + b.type)
        log('\n>>> طريق ١ يعمل — التكامل مباشر <<<')
      }).catch(function(e){
        log('[طريق ١] ✗ فشل: ' + e)
        tryFilesystem(uri)
      })
    }).catch(function(e){
      log('✗ فشل الماسح: ' + (e && e.message ? e.message : e))
      log(JSON.stringify(e))
    })
  }
})();
</script>
</body>
</html>
